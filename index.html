<!DOCTYPE html>

					<button id="btn_maneuver" class="buttonToggle blue"
						onclick="changeButtonColor('btn_maneuver')">Maneuver</button>
				</div>
				<div class="buttonRow">
					<button id="btn_action" class="buttonToggle red" onclick="changeButtonColor('btn_action')">Action</button>
					<button id="btn_trigger" class="buttonToggle green" onclick="changeButtonColor('btn_trigger')">Triggered
						Action</button>
				</div>
			</div>
			<div class="refreshButtonContainer"><button id="btn_refresh" class="refreshButton" onclick="refresh()">Refresh
